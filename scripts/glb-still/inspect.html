<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>GLB inspect</title>
  </head>
  <body>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
      }
    </script>
    <script type="module">
      import * as THREE from "three";
      import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

      const modelUrl = new URLSearchParams(location.search).get("model");
      window.__INSPECT = null;
      try {
        const gltf = await new GLTFLoader().loadAsync(modelUrl);
        const root = gltf.scene;
        const box = new THREE.Box3().setFromObject(root);
        const size = box.getSize(new THREE.Vector3());
        const meshes = [];
        root.traverse((child) => {
          if (!child.isMesh) return;
          const mb = new THREE.Box3().setFromObject(child);
          const ms = mb.getSize(new THREE.Vector3());
          const mc = mb.getCenter(new THREE.Vector3());
          const materials = Array.isArray(child.material) ? child.material : [child.material];
          meshes.push({
            name: child.name,
            parent: child.parent?.name || "",
            materials: materials.map((m) => m?.name || ""),
            size: [+ms.x.toFixed(3), +ms.y.toFixed(3), +ms.z.toFixed(3)],
            center: [+mc.x.toFixed(3), +mc.y.toFixed(3), +mc.z.toFixed(3)],
          });
        });
        window.__INSPECT = {
          size: [+size.x.toFixed(3), +size.y.toFixed(3), +size.z.toFixed(3)],
          meshCount: meshes.length,
          meshes,
        };
        document.title = "READY";
      } catch (error) {
        window.__INSPECT = { error: String(error) };
        document.title = "ERROR";
      }
    </script>
  </body>
</html>
